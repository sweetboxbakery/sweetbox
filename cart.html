<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart | Sweet Box</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cart-page">

  <header class="header" id="header">
    <a href="index.html" class="logo" aria-label="Sweet Box home">
      <img src="images/logo.png" alt="Sweet Box logo">
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <a href="cart.html">Cart</a>
    </nav>

    <div class="auth">
      <a href="login.html">Log in</a>
      <a href="signup.html">Sign Up</a>
    </div>
  </header>

  <!-- banner -->
  <section class="cart-banner">
    <img class="cart-heart" src="images/cart-heart.png" alt="">
    <img class="cart-donut" src="images/cart-donut.png" alt="">
    <img class="cart-croissant" src="images/cart-croissant.png" alt="">

    <div class="cart-banner-text">
      <h1>Your Shopping Cart</h1>
      <p>Sweet treats are waiting for you<br>Review your selected items before checking out.</p>
    </div>
  </section>

  <main class="cart-area">
    <div class="cart-wrap">

      <div class="cart-list" id="cartList"></div>

      <aside class="summary">
        <img class="summary-bag" src="images/icon-bag.png" alt="">
        <h2>ORDER SUMMARY</h2>
        <hr>
        <hr class="short">

        <div class="summary-rows">
          <p><span>Subtotal</span> <span id="subtotal">₱0.00</span></p>
          <p><span>Delivery fee</span> <span id="delivery">₱0.00</span></p>
        </div>

        <hr>
        <hr class="short">

        <p class="summary-total"><span>Total</span> <span id="total">₱0.00</span></p>

        <div class="summary-buttons">
          <button type="button" class="summary-btn" id="checkoutBtn">Proceed to Checkout &gt;</button>
          <a href="categories.html" class="summary-btn">Continue Shopping &gt;</a>
        </div>
      </aside>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
