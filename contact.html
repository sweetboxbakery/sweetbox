<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Sweet Box</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">

  <header class="header" id="header">
    <a href="index.html" class="logo" aria-label="Sweet Box home">
      <img src="images/logo.png" alt="Sweet Box logo">
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <a href="cart.html">Cart</a>
    </nav>

    <div class="auth">
      <a href="login.html">Log in</a>
      <a href="signup.html">Sign Up</a>
    </div>
  </header>

  <main class="about contact">
    <h1 class="reveal">CONTACT US &middot; <em>Get in Touch</em></h1>

    <div class="contact-list">
      <div class="contact-card reveal" style="--d: 0.1s">
        <img src="images/icon-phone.png" alt="" class="icon-phone">
        <h2>Phone Number</h2>
        <p>(02) 4875 27XX</p>
      </div>

      <div class="contact-card reveal" style="--d: 0.2s">
        <img src="images/icon-email.png" alt="" class="icon-email">
        <h2>Email Address</h2>
        <p>sweetbox@gmail.com</p>
      </div>

      <div class="contact-card reveal" style="--d: 0.3s">
        <img src="images/icon-messenger.png" alt="" class="icon-messenger">
        <h2>Messenger</h2>
        <p>Sweet Box PH Official</p>
      </div>
    </div>

    <div class="branch">
      <b>Main Branch</b>
      <img src="images/icon-marker.png" alt="">
      <span>123 Anywhere St., Any City, ST12345</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
