<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | Sweet Box</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <main class="auth-wrap">
    <form class="auth-card" id="authForm" data-next="login.html" data-check-password="yes" novalidate>
      <a href="index.html" class="auth-logo" aria-label="Sweet Box home"><img src="images/logo.png" alt="Sweet Box logo"></a>

      <h1>Create account</h1>
      <div class="field">
        <input type="text" placeholder="Full name" aria-label="Full name" autocomplete="name">
      </div>
      <div class="field">
        <input type="email" placeholder="Email Address" aria-label="Email Address" autocomplete="email">
      </div>
      <div class="field">
        <input type="password" placeholder="Password" aria-label="Password" autocomplete="new-password">
      </div>
      <p class="form-error" id="formError" role="alert" hidden></p>

      <button type="submit" class="auth-btn">Create account</button>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
