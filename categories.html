<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories | Sweet Box</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="categories-page">

  <header class="header" id="header">
    <a href="index.html" class="logo" aria-label="Sweet Box home">
      <img src="images/logo.png" alt="Sweet Box logo">
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <a href="cart.html">Cart</a>
    </nav>

    <div class="auth">
      <a href="login.html">Log in</a>
      <a href="signup.html">Sign Up</a>
    </div>
  </header>

  <div class="header-band" aria-hidden="true"></div>

  <main>

    <section class="categories">
      <div class="cat-list reveal" id="categoryList">
        <button type="button" class="cat-btn" data-category="cakes">
          <span class="cat-pic"><img src="images/icon-cakes.png" alt=""></span>
          <span class="cat-name">Cakes</span>
        </button>
        <button type="button" class="cat-btn active" data-category="cookies">
          <span class="cat-pic"><img src="images/icon-cookies.png" alt=""></span>
          <span class="cat-name">Cookies</span>
        </button>
        <button type="button" class="cat-btn" data-category="pastries">
          <span class="cat-pic"><img src="images/icon-pastries.png" alt=""></span>
          <span class="cat-name">Pastries</span>
        </button>
	<button type="button" class="cat-btn" data-category="chocolates">
          <span class="cat-pic"><img src="images/icon-chocolates.png" alt=""></span>
          <span class="cat-name">Chocolates</span>
        </button>

      </div>
    </section>

    <section class="menu-panel">
      <div class="menu-grid" id="menuGrid" data-category="cookies"></div>

      <div class="product-panel" id="productPanel" tabindex="-1" hidden>
        <button type="button" class="panel-close" id="panelClose" aria-label="Close">&times;</button>

        <div class="panel-pic" id="panelPic">
          <img id="panelImg" src="" alt="">
        </div>

        <div class="panel-text">
          <h2 id="panelName"></h2>
          <p class="panel-rating"><span class="item-stars" aria-hidden="true">★★★★★</span> <span id="panelRating"></span></p>
          <p class="panel-desc" id="panelDesc"></p>
          <p class="panel-price" id="panelPrice"></p>
          <button type="button" class="cart-btn" id="addToCart">Add to Cart</button>
        </div>
      </div>
    </section>

    <section class="perks">
      <h2 class="reveal">Freshly Baked Goods !</h2>

      <div class="perk-list">
        <div class="perk reveal" style="--d: 0.1s">
          <img src="images/icon-shipping.png" alt="">
          <h3>Free Shipping</h3>
          <p>On orders over ₱500</p>
        </div>
        <div class="perk reveal" style="--d: 0.2s">
          <img src="images/icon-returns.png" alt="">
          <h3>Easy Returns</h3>
          <p>Can be returned if the goods is damage</p>
        </div>
        <div class="perk reveal" style="--d: 0.3s">
          <img src="images/icon-secure.png" alt="">
          <h3>Secure Payments</h3>
          <p>100% sercure checkout</p>
        </div>
      </div>
    </section>

    <section class="follow">
      <p>follow us @sweet.box on IG and TOKTIK</p>
      <img src="images/logo.png" alt="Sweet Box logo">
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Added to cart.</div>

  <script src="script.js"></script>
</body>
</html>
